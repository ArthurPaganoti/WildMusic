spring:
  application:
    name: Spotify
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://198.89.99.206:5432/${DB_NAME:spotify}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          order_inserts: true
          order_updates: true
          batch_size: 30
  data:
    redis:
      host: 198.89.99.206
      port: 6379
      database: 1
  cache:
    type: redis

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

  mail:
    host: 198.89.99.206
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
        transport:
          protocol: smtp

